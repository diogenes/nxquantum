name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "0"
      NXQ_ENABLE_TORCHX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-core-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-core-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Quality gate
        run: mix ci

      - name: Build package artifact
        run: mix hex.build

      - name: Batch observable regression guard
        env:
          NXQ_BATCH_OBS_GUARD_ITERATIONS: "80"
          NXQ_BATCH_OBS_GUARD_WARMUP: "15"
          NXQ_BATCH_OBS_MAX_PER_OP_MS: "2.0281935"
        run: mix bench.batch_obs_guard

  floor-elixir-1-19-otp-28:
    name: floor-elixir-1.19-otp-28
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "0"
      NXQ_ENABLE_TORCHX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir (supported floor)
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1"
          elixir-version: "1.19.1"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-floor-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-floor-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

  exla-smoke:
    name: exla-smoke
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "1"
      NXQ_ENABLE_TORCHX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-exla-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-exla-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: |
          mix test
          mix test.features

  provider-smoke:
    name: provider-smoke
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "0"
      NXQ_ENABLE_TORCHX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-provider-smoke-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-provider-smoke-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Provider smoke lane
        run: mix test.provider_smoke

  torchx-optional:
    name: torchx-optional
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "0"
      NXQ_ENABLE_TORCHX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-torchx-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-torchx-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

  kg17-bench:
    name: kg17-bench
    if: github.head_ref == 'feat/h2.4-kg17-cache-byte-cap'
    needs: []
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      NXQ_ENABLE_EXLA: "0"
      NXQ_ENABLE_TORCHX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-kg17-bench-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-kg17-bench-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install deps
        run: mix deps.get

      - name: KG-17 bench (branch)
        env:
          KG17_LABEL: branch
        run: mix run bench/kg17_cache_miss_bench.exs | tee kg17-branch.txt

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Cache deps and build (main)
        uses: actions/cache@v4
        with:
          path: |
            main/deps
            main/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-kg17-bench-main-${{ hashFiles('main/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-kg17-bench-main-
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-kg17-bench-

      - name: Install deps (main)
        working-directory: main
        run: mix deps.get

      - name: Copy KG-17 bench script into main
        run: cp bench/kg17_cache_miss_bench.exs main/bench/kg17_cache_miss_bench.exs

      - name: KG-17 bench (main)
        working-directory: main
        env:
          KG17_LABEL: main
        run: mix run bench/kg17_cache_miss_bench.exs | tee ../kg17-main.txt

      - name: Show KG-17 results
        run: cat kg17-branch.txt kg17-main.txt
